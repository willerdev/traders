name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      RENDER_DEPLOY_HOOK_SOLO_API: ${{ secrets.RENDER_DEPLOY_HOOK_SOLO_API }}
      RENDER_DEPLOY_HOOK_SOLO_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_SOLO_WEB }}
    steps:
      - name: Deploy traders-api (backend)
        if: ${{ env.RENDER_DEPLOY_HOOK_API != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_API"

      - name: Deploy traders-web (frontend)
        if: ${{ env.RENDER_DEPLOY_HOOK_WEB != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_WEB"

      - name: Deploy solo-api
        if: ${{ env.RENDER_DEPLOY_HOOK_SOLO_API != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_SOLO_API"

      - name: Deploy solo-web
        if: ${{ env.RENDER_DEPLOY_HOOK_SOLO_WEB != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_SOLO_WEB"
